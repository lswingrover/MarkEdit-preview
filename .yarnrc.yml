# Only the MarkEdit-app organization's repositories may be used as git-sourced
# dependencies (markedit-api, markedit-vite, markedit-katex).
approvedGitRepositories:
  - "https://github.com/MarkEdit-app/**"

# Third-party install scripts are off. This project's own postinstall
# (patch-package) still runs, since Yarn always runs workspace scripts.
# Allow a dependency's build step individually via dependenciesMeta in
# package.json only if it is genuinely required.
enableScripts: false

nodeLinker: node-modules

# Refuse npm versions published less than three days ago, to give the registry
# time to catch hijacked releases before they can be installed here.
npmMinimalAgeGate: 3d
